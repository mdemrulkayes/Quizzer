<div class="flex min-h-screen">
  <app-sidebar [collapsed]="sidebarCollapsed()" />
  <div class="flex-1 flex flex-col min-w-0">
    <app-topbar (toggleSidebar)="toggleSidebar()" />
    @if (navigating()) {
      <p-progressBar mode="indeterminate" [style]="{ height: '3px' }" styleClass="rounded-none border-none" />
    }
    <div class="flex-1 p-6 bg-[var(--p-surface-50)] overflow-y-auto">
      <router-outlet />
    </div>
  </div>
</div>
<p-toast />
