<div class="flex flex-col min-h-screen bg-[var(--p-surface-0)] border-r border-[var(--p-surface-200)] transition-[width] duration-200 ease-in-out overflow-hidden"
     [class]="collapsed() ? 'w-16' : 'w-[260px]'">
  <div class="p-4 flex items-center justify-center border-b border-[var(--p-surface-200)] min-h-16">
    <span class="flex items-center gap-2 text-xl font-bold text-[var(--p-primary-color)]">
      <i class="pi pi-book text-2xl"></i>
      @if (!collapsed()) {
        <span>Quizzer</span>
      }
    </span>
  </div>
  <nav class="flex flex-col p-2 gap-1 flex-1">
    @for (item of filteredMenuItems(); track item.label) {
      <a
        class="nav-item flex items-center gap-3 py-3 px-4 rounded-[var(--p-border-radius)] text-[var(--p-text-color)] no-underline transition-colors duration-150 whitespace-nowrap hover:bg-[var(--p-surface-100)]"
        [routerLink]="item.routerLink"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.routerLink?.[0] === '/dashboard' }"
        [title]="item.label || ''"
      >
        <i [ngClass]="item.icon || ''" class="text-[1.1rem] w-5 text-center"></i>
        @if (!collapsed()) {
          <span>{{ item.label }}</span>
        }
      </a>
    }
  </nav>
</div>
