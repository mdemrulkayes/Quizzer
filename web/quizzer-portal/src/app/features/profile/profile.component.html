<h2 class="m-0 mb-4 text-[var(--p-text-color)]">My Profile</h2>
@if (authService.currentUser(); as user) {
  <p-card>
    <div class="flex flex-col gap-4 w-full">
      @if (!editMode()) {
        <div class="flex flex-col gap-1 w-full">
          <label class="font-semibold text-sm text-[var(--p-text-muted-color)]">Name</label>
          <span class="text-base text-[var(--p-text-color)]">{{ user.firstName }} {{ user.lastName }}</span>
        </div>
        <div class="flex flex-col gap-1 w-full">
          <label class="font-semibold text-sm text-[var(--p-text-muted-color)]">Email</label>
          <span class="text-base text-[var(--p-text-color)]">{{ user.email }}</span>
        </div>
        <div class="flex flex-col gap-1 w-full">
          <label class="font-semibold text-sm text-[var(--p-text-muted-color)]">Roles</label>
          <div class="flex gap-2 flex-wrap">
            @for (role of user.roles; track role) {
              <p-tag [value]="role" severity="info" />
            }
          </div>
        </div>
        <div class="flex gap-2 mt-2">
          <p-button label="Edit Name" icon="pi pi-pencil" severity="warn" [text]="true" (onClick)="startEdit()" />
        </div>
      } @else {
        <div class="flex flex-col gap-4">
          <div class="flex flex-col gap-1 w-full">
            <label class="font-semibold text-sm text-[var(--p-text-muted-color)]">First Name</label>
            <input pInputText [(ngModel)]="editFirstName" placeholder="First name" class="w-full" />
          </div>
          <div class="flex flex-col gap-1 w-full">
            <label class="font-semibold text-sm text-[var(--p-text-muted-color)]">Last Name</label>
            <input pInputText [(ngModel)]="editLastName" placeholder="Last name" class="w-full" />
          </div>
          <div class="flex gap-2 mt-2">
            <p-button
              label="Save"
              icon="pi pi-check"
              (onClick)="saveProfile()"
              [loading]="saving()"
              [disabled]="!editFirstName.trim() || !editLastName.trim()"
            />
            <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="cancelEdit()" />
          </div>
        </div>
      }
    </div>
  </p-card>
}
