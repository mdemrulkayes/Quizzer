<div class="mb-8">
  <h2 class="m-0 mb-2 text-[1.75rem] text-[var(--p-text-color)]">Dashboard</h2>
  <p class="m-0 flex items-center gap-3 text-[1.05rem] text-[var(--p-text-muted-color)]">
    Welcome back, <strong>{{ authService.currentUser()?.firstName ?? 'User' }}</strong>!
    <p-tag [value]="dashboardType() | titlecase" severity="info" />
  </p>
</div>

@if (loading()) {
  <div class="grid grid-cols-[repeat(auto-fill,minmax(260px,1fr))] gap-6">
    @for (i of [1, 2, 3]; track i) {
      <p-card styleClass="dashboard-card">
        <div class="flex items-center gap-[1.25rem] py-2 min-h-[72px]">
          <div class="skeleton-icon w-14 h-14 rounded-xl bg-[var(--p-surface-100)] flex items-center justify-center shrink-0"></div>
          <div class="flex flex-col overflow-hidden">
            <span class="skeleton-text text-[2rem] font-bold leading-[1.2] text-[var(--p-text-color)]">&nbsp;</span>
            <span class="skeleton-text text-[0.9rem] text-[var(--p-text-muted-color)] mt-[0.15rem] whitespace-nowrap overflow-hidden text-ellipsis">&nbsp;</span>
          </div>
        </div>
      </p-card>
    }
  </div>
} @else {
  <div class="grid grid-cols-[repeat(auto-fill,minmax(260px,1fr))] gap-6">
    @for (card of cards(); track card.label) {
      <p-card styleClass="dashboard-card" (click)="navigateTo(card.route)">
        <div class="flex items-center gap-[1.25rem] py-2 min-h-[72px]">
          <div class="w-14 h-14 rounded-xl bg-[var(--p-surface-100)] flex items-center justify-center shrink-0">
            <i [class]="card.icon + ' text-[1.75rem]'" [style.color]="card.color"></i>
          </div>
          <div class="flex flex-col overflow-hidden">
            <span class="text-[2rem] font-bold leading-[1.2] text-[var(--p-text-color)]">{{ card.count }}</span>
            <span class="text-[0.9rem] text-[var(--p-text-muted-color)] mt-[0.15rem] whitespace-nowrap overflow-hidden text-ellipsis">{{ card.label }}</span>
          </div>
        </div>
      </p-card>
    }
  </div>
}
