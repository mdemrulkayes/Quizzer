<div class="flex justify-between items-center mb-6">
  <h2 class="m-0 text-[var(--p-text-color)] text-2xl">Interview Prep Materials</h2>
</div>

<p-table
  [value]="materials()"
  [paginator]="true"
  [rows]="pageSize"
  [rowsPerPageOptions]="[5, 10, 25]"
  [loading]="loading()"
  [rowHover]="true"
  styleClass="p-datatable-sm"
>
  <ng-template #header>
    <tr>
      <th>Job Title</th>
      <th>Key Topics</th>
      <th>Created Date</th>
      <th style="width: 6rem">Actions</th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr class="cursor-pointer" (click)="viewDetail(item)">
      <td class="font-medium">{{ item.jobTitle }}</td>
      <td>
        <div class="flex flex-wrap gap-1">
          @for (topic of item.keyTopics; track topic) {
            <p-tag [value]="topic" severity="info" />
          }
        </div>
      </td>
      <td>{{ item.createdAt | date:'mediumDate' }}</td>
      <td>
        <p-button icon="pi pi-eye" [text]="true" [rounded]="true" severity="info" (onClick)="viewDetail(item); $event.stopPropagation()" />
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="4" class="text-center p-4">No interview prep materials found.</td>
    </tr>
  </ng-template>
</p-table>
